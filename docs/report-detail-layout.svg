<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="1536" viewBox="0 0 1040 1536" role="img" aria-labelledby="title desc">
<title id="title">Agent Safety Arena comparison detail layout</title>
<desc id="desc">Static target layout with placeholder content. Header and six sections. Two group columns show media, prompts, replies, and expandable evidence. No experimental result is shown.</desc>
<rect width="1040" height="1536" fill="#f4f6f8"/>
<g font-family="Segoe UI, Microsoft YaHei, sans-serif" fill="#243347">
<text x="40" y="33" font-size="14" font-weight="600" fill="#2563b6">AGENT SAFETY ARENA</text>
<text x="770" y="33" font-size="14" font-weight="600" fill="#6a7687">LAYOUT REFERENCE ONLY</text>
<rect x="40" y="52" width="960" height="168" rx="10" fill="#fff" stroke="#dbe2e9"/>
<text x="60" y="79" font-size="14" font-weight="400" fill="#2563b6">Back to cases  /  Interaction safety</text>
<text x="60" y="110" font-size="18" font-weight="600" fill="#243347">Case title: describe the observed action</text>
<text x="60" y="136" font-size="14" font-weight="400" fill="#243347">One sentence: what the baseline and compared environment attempt</text>
<text x="60" y="162" font-size="14" font-weight="400" fill="#526278">Date  |  OS  |  Agent/version  |  Model  |  Reasoning  |  Access and approval mode</text>
<text x="60" y="188" font-size="14" font-weight="600" fill="#243347">Scoped result: not reviewed in this illustration</text>
<text x="60" y="208" font-size="14" font-weight="400" fill="#2563b6">Scenario   Result   Media   Prompt   Replies   Evidence</text>
<rect x="40" y="236" width="960" height="112" rx="10" fill="#fff" stroke="#dbe2e9"/>
<text x="60" y="267" font-size="18" font-weight="600" fill="#243347">01  Scenario and impact</text>
<text x="60" y="294" font-size="14" font-weight="400" fill="#243347">Requested action, owned target, and allowed boundary</text>
<text x="60" y="321" font-size="14" font-weight="400" fill="#526278">Possible user impact is separate from the effect actually observed.</text>
<rect x="40" y="364" width="960" height="196" rx="10" fill="#fff" stroke="#dbe2e9"/>
<text x="60" y="395" font-size="18" font-weight="600" fill="#243347">02  Observed comparison and limits</text>
<text x="60" y="426" font-size="14" font-weight="600" fill="#243347">Observation</text>
<text x="340" y="426" font-size="14" font-weight="600" fill="#243347">Baseline: native Agent</text>
<text x="660" y="426" font-size="14" font-weight="600" fill="#243347">Compared environment</text>
<text x="60" y="456" font-size="14" font-weight="400" fill="#243347">Actual action</text>
<text x="340" y="456" font-size="14" font-weight="400" fill="#526278">Reviewed evidence required</text>
<text x="660" y="456" font-size="14" font-weight="400" fill="#526278">Reviewed evidence required</text>
<text x="60" y="484" font-size="14" font-weight="400" fill="#243347">Target final state</text>
<text x="340" y="484" font-size="14" font-weight="400" fill="#526278">Reviewed evidence required</text>
<text x="660" y="484" font-size="14" font-weight="400" fill="#526278">Reviewed evidence required</text>
<text x="60" y="520" font-size="14" font-weight="400" fill="#243347">Short mechanism explanation supported by evidence; identify the denied step.</text>
<text x="60" y="543" font-size="14" font-weight="400" fill="#526278">Disclose condition differences, alternative effects, and incomplete observations.</text>
<rect x="40" y="576" width="960" height="280" rx="10" fill="#fff" stroke="#dbe2e9"/>
<text x="60" y="607" font-size="18" font-weight="600" fill="#243347">03  Side-by-side media evidence</text>
<text x="60" y="638" font-size="14" font-weight="600" fill="#243347">Baseline: native Agent</text>
<rect x="60" y="650" width="450" height="130" rx="10" fill="#edf2f7" stroke="#dbe2e9"/>
<text x="80" y="678" font-size="14" font-weight="400" fill="#526278">Video poster OR reviewed final-state screenshot</text>
<text x="80" y="714" font-size="14" font-weight="400" fill="#2563b6">[ Play / pause ]   [ Seek ]   [ Fullscreen ]</text>
<text x="80" y="752" font-size="14" font-weight="400" fill="#526278">Controls apply to video evidence only</text>
<text x="60" y="808" font-size="14" font-weight="400" fill="#243347">Caption: actual effect and source time range</text>
<text x="60" y="832" font-size="14" font-weight="400" fill="#526278">Edit / waiting omitted / missing-media label</text>
