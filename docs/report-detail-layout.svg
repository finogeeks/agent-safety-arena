<text x="550" y="714" font-size="14" font-weight="400" fill="#2563b6">[ Play / pause ]   [ Seek ]   [ Fullscreen ]</text>
<text x="550" y="752" font-size="14" font-weight="400" fill="#526278">Controls apply to video evidence only</text>
<text x="530" y="808" font-size="14" font-weight="400" fill="#243347">Caption: actual effect and source time range</text>
<text x="530" y="832" font-size="14" font-weight="400" fill="#526278">Edit / waiting omitted / missing-media label</text>
<rect x="40" y="872" width="960" height="156" rx="10" fill="#fff" stroke="#dbe2e9"/>
<text x="60" y="903" font-size="18" font-weight="600" fill="#243347">04  Actual submitted prompt</text>
<text x="60" y="932" font-size="14" font-weight="400" fill="#243347">One full prompt when identical; otherwise separate group versions.</text>
<text x="60" y="958" font-size="14" font-weight="400" fill="#526278">Version and hash  |  Label privacy substitutions and wording differences</text>
<rect x="60" y="976" width="118" height="30" rx="6" fill="#eef5ff" stroke="#c3d6f0"/>
<text x="76" y="996" font-size="14" font-weight="400" fill="#2563b6">Copy prompt</text>
<rect x="40" y="1044" width="960" height="176" rx="10" fill="#fff" stroke="#dbe2e9"/>
<text x="60" y="1075" font-size="18" font-weight="600" fill="#243347">05  Verified public final replies</text>
<rect x="60" y="1095" width="450" height="102" rx="10" fill="#f8fafc" stroke="#dbe2e9"/>
<text x="76" y="1120" font-size="14" font-weight="600" fill="#243347">Baseline reply</text>
<text x="76" y="1144" font-size="14" font-weight="400" fill="#526278">Short public excerpt; native end state</text>
<text x="76" y="1166" font-size="14" font-weight="400" fill="#526278">Expand and copy the full reviewed reply</text>
<rect x="530" y="1095" width="450" height="102" rx="10" fill="#f8fafc" stroke="#dbe2e9"/>
<text x="546" y="1120" font-size="14" font-weight="600" fill="#243347">Comparison reply</text>
<text x="546" y="1144" font-size="14" font-weight="400" fill="#526278">Short public excerpt; native end state</text>
<text x="546" y="1166" font-size="14" font-weight="400" fill="#526278">Note conflicts with independent observations</text>
<rect x="40" y="1236" width="960" height="238" rx="10" fill="#fff" stroke="#dbe2e9"/>
<text x="60" y="1267" font-size="18" font-weight="600" fill="#243347">06  Summary and expandable evidence</text>
<text x="60" y="1294" font-size="14" font-weight="400" fill="#243347">One or two sentences limited to this case and these conditions.</text>
<rect x="60" y="1310" width="920" height="140" rx="10" fill="#f8fafc" stroke="#dbe2e9"/>
<text x="76" y="1335" font-size="14" font-weight="600" fill="#243347">[ Expand run and evidence records ]</text>
<text x="76" y="1359" font-size="14" font-weight="400" fill="#526278">Conditions and approval source / timing / scope / decision</text>
<text x="76" y="1381" font-size="14" font-weight="400" fill="#526278">Actual calls and returns; final API invoked or not invoked</text>
<text x="76" y="1403" font-size="14" font-weight="400" fill="#526278">Independent observations; completion; evidence gaps; recovery and cleanup</text>
<text x="76" y="1425" font-size="14" font-weight="400" fill="#526278">Reviewed public references only; raw/private material is not linked</text>
<text x="40" y="1504" font-size="14" font-weight="400" fill="#64748b">Target specification, not an implemented page. Mobile: baseline first, then comparison.</text>
</g>
