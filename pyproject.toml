[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-safety-arena"
version = "0.1.0"
description = "Controlled AI agent safety evaluation and static evidence reports"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
arena = "arena.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["arena*"]

[tool.setuptools.package-data]
"arena.adapters.agents" = ["*.cjs", "*.mjs"]
